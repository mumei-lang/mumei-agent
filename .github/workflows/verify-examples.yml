name: Verify Examples

on:
  push:
    branches: [develop]
    paths:
      - 'examples/*.mm'
      - 'scripts/ci_verify.py'
  pull_request:
    branches: [develop]
    paths:
      - 'examples/*.mm'
      - 'scripts/ci_verify.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mumei (if available)
        id: install-mumei
        continue-on-error: true
        run: |
          curl -fsSL https://mumei-lang.github.io/mumei/install.sh | bash
          echo "$HOME/.mumei/bin" >> $GITHUB_PATH

      - name: Run verification on examples
        if: steps.install-mumei.outcome == 'success'
        run: |
          python scripts/ci_verify.py examples/*.mm --output verification-report.md || true
          cat verification-report.md

      - name: Post PR comment
        if: github.event_name == 'pull_request' && steps.install-mumei.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mumei-verify
          path: verification-report.md

      - name: Skip notice
        if: steps.install-mumei.outcome != 'success'
        run: echo "::notice::mumei binary not available; verification skipped"
