name: SI-5 Autonomous Proliferation

# SI-5 Phase 3-B — weekly scheduled self-improvement loop.
#
# Workflow:
#   1. Check out mumei-agent (this repo) and mumei (cross-repo).
#   2. Build the mumei compiler from source so `python -m agent ...` has a
#      real binary to invoke for verification.
#   3. Provision the LLM backend according to the selected `llm_profile`:
#        - ollama-local : spin up an Ollama server on the runner and pull
#                         a qwen model (default qwen3.5:4b; the 0.8b
#                         variant remains available as a CI smoke-test
#                         option). Requires zero additional secrets.
#        - remote       : use any OpenAI-compatible endpoint configured via
#                         repository secrets (DashScope / vLLM / self-hosted
#                         Ollama over tailscale / OpenAI). Requires
#                         LLM_API_KEY (or legacy OPENAI_API_KEY) and
#                         optionally LLM_BASE_URL / LLM_MODEL.
#   4. Install agent dependencies.
#   5. Record a pre-flight proof-health snapshot of `mumei/std/`.
#   6. Run `python -m agent proliferate` which:
#        analyze gaps -> generate spec -> forge code -> blast-radius check ->
#        optionally open PR(s) against mumei-lang/mumei.
#   7. Record a post-flight proof-health snapshot.
#   8. Upload all health snapshots + proliferate log + structured JSON summary
#      as a single CI artifact for after-the-fact inspection.
#
# Required repository secrets (set these in
# Settings -> Secrets and variables -> Actions for mumei-lang/mumei-agent):
#   - MUMEI_PAT        : PAT or GitHub App token with `contents:write` +
#                        `pull-requests:write` on mumei-lang/mumei.  Used to
#                        check out mumei, push branches, and open PRs.
#                        Shared with the Forge workflow.
#   - MUMEI_REPO_TOKEN : Legacy alias for MUMEI_PAT; consulted as a fallback
#                        when MUMEI_PAT is not set.  New deployments should
#                        populate MUMEI_PAT instead.
#
# Optional repository secrets (only consumed when llm_profile = remote):
#   - LLM_API_KEY      : API key for the remote OpenAI-compatible endpoint.
#   - LLM_BASE_URL     : Base URL (e.g. https://dashscope.aliyuncs.com/compatible-mode/v1).
#   - LLM_MODEL        : Model name (e.g. qwen-plus). Falls back to the
#                        workflow_dispatch `llm_model` input.
#   - OPENAI_API_KEY   : Legacy alias for LLM_API_KEY; used only as fallback.
#
# Use `workflow_dispatch` with `dry_run=true` only when explicitly
# exercising the pipeline without creating PRs.

on:
  schedule:
    # Every Monday 00:00 UTC (Monday 09:00 JST).
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      max_proposals:
        description: 'Maximum number of proposals to process'
        default: '3'
        type: string
      dry_run:
        description: 'Dry run (skip git/PR operations)'
        default: 'false'
        type: boolean
      llm_profile:
        description: 'LLM backend profile'
        default: 'ollama-local'
        type: choice
        options:
          - ollama-local
          - remote
      run_benchmark:
        description: 'Run LLM benchmark suite after proliferation'
        default: false
        type: boolean
      llm_model:
        description: |
          Model tag. For ollama-local, anything `ollama pull` accepts
          (qwen3.5:0.8b, qwen3.5:4b, qwen2.5-coder:1.5b,
          qwen2.5-coder:7b, or a 1bit-quantized backup like
          bonsai-1bit-qwen if pullable).
          For remote, the model name your endpoint exposes (qwen-plus,
          Qwen/Qwen3.5-7B, gpt-4o-mini, ...).

          Quality vs cost trade-offs (benchmark against
          forge_tasks/vstd_math_abs.json, difficulty=low; see
          tests/test_llm_benchmark.py for the measurement script):

          - gpt-4o-mini            — recommended remote default. High
                                     success rate (~0.8+) on low/medium
                                     forge tasks, moderate cost.
          - qwen-plus              — competitive remote alternative via
                                     DashScope; comparable success rate,
                                     lower $/token.
          - qwen2.5-coder:7b       — strongest ollama-local option. Needs
                                     ~8GB VRAM; success rate usually
                                     tracks gpt-4o-mini minus ~10 pp.
          - qwen3.5:4b (default)   — balanced ollama-local option. Runs
                                     on CPU in <2 min/iter; success rate
                                     ~0.5-0.7 on low-difficulty tasks.
          - qwen3.5:0.8b           — fastest local option for CI
                                     smoke-tests and dry runs. Expect
                                     lower success rate (~0.3-0.5) and
                                     higher avg_retries; prefer the
                                     4b/7b variants for real forging.

          Run ``pytest -m benchmark tests/test_llm_benchmark.py`` with
          ``LLM_BENCHMARK_MODELS`` set to compare several models
          side-by-side. Results are written as JSON with per-model
          ``success_rate`` / ``avg_code_length`` / ``avg_time_seconds``.
        default: 'qwen3.5:4b'
        type: string

jobs:
  proliferate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Scheduled runs have no workflow_dispatch inputs, so default to the
      # fully self-contained ollama-local profile with the qwen3.5:4b model.
      LLM_PROFILE: ${{ github.event.inputs.llm_profile || 'ollama-local' }}
      LLM_MODEL_INPUT: ${{ github.event.inputs.llm_model || 'qwen3.5:4b' }}
    steps:
      - name: Check out mumei-agent
        uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei-agent
          ref: develop
          path: mumei-agent

      - name: Check out mumei
        uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei
          ref: develop
          path: mumei
          # Prefer MUMEI_PAT (shared with forge.yml); fall back to the
          # legacy MUMEI_REPO_TOKEN secret, and finally to GITHUB_TOKEN so
          # read-only checkouts of the public mumei repo still succeed
          # when no PAT is configured.  Note: the downstream PR-creation
          # step still requires a real PAT with write access to
          # mumei-lang/mumei; GITHUB_TOKEN is scoped to this repo only.
          token: ${{ secrets.MUMEI_PAT || secrets.MUMEI_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check out mumei-lean
        # Best-effort checkout: the Lean fallback is optional and the
        # bridge degrades gracefully when the repo is unavailable (see
        # agent/lean_bridge.py::lean_fallback_available).  A failure here
        # must not abort the entire proliferation pipeline (gap analysis,
        # forge, blast-radius, PR creation all run independently of Lean).
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mumei-lang/mumei-lean
          ref: develop
          path: mumei-lean
          # Mirror the token fallback chain used for the mumei checkout
          # above so this keeps working if mumei-lean ever goes private.
          # GITHUB_TOKEN alone is scoped to mumei-agent and cannot read
          # sibling private repos in the mumei-lang org.
          token: ${{ secrets.MUMEI_PAT || secrets.MUMEI_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lean toolchain (best-effort)
        continue-on-error: true
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.16.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install mumei system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libz3-dev z3 libzstd-dev
          # Detect the Ubuntu codename so the LLVM repo stays correct
          # when GitHub updates ubuntu-latest beyond Jammy (22.04).
          CODENAME="$(lsb_release -cs)"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] \
            http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-17.list
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev libpolly-17-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mumei/target
          key: cargo-mumei-${{ hashFiles('mumei/Cargo.lock') }}
          restore-keys: |
            cargo-mumei-

      - name: Build mumei compiler
        working-directory: mumei
        env:
          LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Verify mumei binary is on PATH
        run: |
          which mumei
          mumei --version || true

      - name: Install agent dependencies
        working-directory: mumei-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # ----- LLM provisioning: ollama-local -----

      - name: Cache ollama models
        if: env.LLM_PROFILE == 'ollama-local'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.LLM_MODEL_INPUT }}
          restore-keys: |
            ollama-

      - name: Install and start Ollama
        if: env.LLM_PROFILE == 'ollama-local'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Run ollama serve in the background so later steps can talk to it.
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          # Wait for the HTTP API to become ready (timeout after 30s).
          OLLAMA_READY=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama ready after ${i}s"
              OLLAMA_READY=true
              break
            fi
            sleep 1
          done
          if [ "$OLLAMA_READY" != "true" ]; then
            echo "::error::ollama failed to start within 30 seconds"
            cat /tmp/ollama.log || true
            exit 1
          fi
          curl -fsS http://localhost:11434/api/tags

      - name: Pull ollama model
        if: env.LLM_PROFILE == 'ollama-local'
        run: |
          echo "Pulling ${LLM_MODEL_INPUT}..."
          ollama pull "${LLM_MODEL_INPUT}"
          ollama list

      # ----- LLM provisioning: remote -----
      # No install step; the agent talks to the configured endpoint directly.

      - name: Resolve LLM environment
        id: llm_env
        env:
          _LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          _OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          _LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          _LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ "${LLM_PROFILE}" = "ollama-local" ]; then
            echo "api_key=ollama" >> "$GITHUB_OUTPUT"
            echo "base_url=http://localhost:11434/v1" >> "$GITHUB_OUTPUT"
            echo "model=${LLM_MODEL_INPUT}" >> "$GITHUB_OUTPUT"
          else
            # Remote profile: read secrets via env vars (never inline
            # ${{ secrets.* }} in the script body — values containing $
            # or backticks would be corrupted by shell expansion).
            REMOTE_KEY="${_LLM_API_KEY}"
            if [ -z "${REMOTE_KEY}" ]; then
              # Legacy fallback for existing deployments.
              REMOTE_KEY="${_OPENAI_API_KEY}"
            fi
            if [ -z "${REMOTE_KEY}" ]; then
              echo "::error::llm_profile=remote but neither LLM_API_KEY nor OPENAI_API_KEY is set"
              exit 1
            fi
            # Ensure the key is redacted from all subsequent log output.
            echo "::add-mask::${REMOTE_KEY}"
            REMOTE_BASE="${_LLM_BASE_URL}"
            REMOTE_MODEL="${_LLM_MODEL}"
            if [ -z "${REMOTE_MODEL}" ]; then
              REMOTE_MODEL="${LLM_MODEL_INPUT}"
            fi
            {
              echo "api_key<<__EOF__"
              echo "${REMOTE_KEY}"
              echo "__EOF__"
              echo "base_url=${REMOTE_BASE}"
              echo "model=${REMOTE_MODEL}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight health check
        id: pre_health
        working-directory: mumei-agent
        env:
          MUMEI_BIN: mumei
        run: |
          mkdir -p /tmp/proliferate
          python -m agent health \
            --mumei-repo ../mumei \
            --format json \
            > /tmp/proliferate/pre_health.json
          cat /tmp/proliferate/pre_health.json

      - name: Run proliferate
        id: proliferate
        working-directory: mumei-agent
        # IMPORTANT: workflow_dispatch inputs are passed via environment
        # variables instead of being interpolated into the script body,
        # to prevent shell injection via crafted input values.
        # See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
        env:
          LLM_API_KEY: ${{ steps.llm_env.outputs.api_key }}
          LLM_BASE_URL: ${{ steps.llm_env.outputs.base_url }}
          LLM_MODEL: ${{ steps.llm_env.outputs.model }}
          MUMEI_BIN: mumei
          # The mumei compiler searches MUMEI_STD_PATH when resolving
          # `import "std/..."` statements from source files that live
          # outside the mumei repo tree (e.g. NamedTemporaryFile paths
          # under /tmp that the agent uses for pre-publish parse checks).
          # Without this, generated modules that import std/core fail at
          # parse time with an unresolvable import and the self-heal loop
          # cannot recover.  Points at the checkout from the previous
          # `Checkout mumei compiler` step.
          MUMEI_STD_PATH: ${{ github.workspace }}/mumei/std
          # Lean fallback attempts to discharge Z3 ``unknown`` atoms via
          # the mumei-lean bridge. The toolchain install is best-effort,
          # and the bridge degrades gracefully if lake/Lean is unavailable.
          MUMEI_LEAN_REPO: ${{ github.workspace }}/mumei-lean
          # P10 — prefer the authoritative gap rules from the mumei
          # checkout instead of the offline copy in agent/gap_rules.py.
          # Combined with PYTHONPATH below, this lets analyze_gaps
          # delegate to mumei's mcp_server.analyze_std_gaps so the rule
          # set always matches whatever ships in the mumei repo on this
          # commit.  Falls back transparently when the import fails.
          PREFER_MCP_GAPS: 'true'
          PYTHONPATH: ${{ github.workspace }}/mumei
          # Agent-internal token for pushing branches / opening PRs on
          # mumei-lang/mumei.  Must be a real PAT; the default GITHUB_TOKEN
          # cannot push across repositories, so no GITHUB_TOKEN fallback.
          GITHUB_TOKEN: ${{ secrets.MUMEI_PAT || secrets.MUMEI_REPO_TOKEN }}
          GITHUB_OWNER: mumei-lang
          GITHUB_REPO: mumei
          MAX_PROPOSALS: ${{ github.event.inputs.max_proposals || '3' }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DRY_RUN_FLAG=""
          # Schedule runs now create real PRs after an operator has
          # verified the pipeline end-to-end via workflow_dispatch with
          # dry_run=false. Manual runs still respect the `dry_run` input.
          if [ "$EVENT_NAME" = "schedule" ]; then
            DRY_RUN_FLAG=""  # Schedule runs now create real PRs
          elif [ "$DRY_RUN_INPUT" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          echo "[PROLIFERATE] profile=${LLM_PROFILE} model=${LLM_MODEL} base_url=${LLM_BASE_URL:-<openai-default>}"
          set -o pipefail
          python -m agent proliferate \
            --mumei-repo ../mumei \
            --max-proposals "$MAX_PROPOSALS" \
            --output-json /tmp/proliferate/summary.json \
            --enable-lean-fallback \
            $DRY_RUN_FLAG \
            2>&1 | tee /tmp/proliferate/proliferate.log

      - name: Post-flight health check
        if: always()
        working-directory: mumei-agent
        env:
          MUMEI_BIN: mumei
        run: |
          mkdir -p /tmp/proliferate
          python -m agent health \
            --mumei-repo ../mumei \
            --format json \
            > /tmp/proliferate/post_health.json || true
          cat /tmp/proliferate/post_health.json || true

      - name: Compare pre/post health (PR 4)
        id: health_compare
        if: always()
        run: |
          # PR 4: emit a ::warning annotation when post-flight health
          # regresses below pre-flight. The health_regression output is
          # consumed after artifact upload so forensic logs are preserved
          # even when the run is marked failed.
          set -e
          SUMMARY_REGRESSION="0"
          if [ -s /tmp/proliferate/summary.json ]; then
            SUMMARY_DELTA=$(python3 -c "import json; d=json.load(open('/tmp/proliferate/summary.json')); v=d.get('health_delta'); print('' if v is None else v)")
            if [ -n "$SUMMARY_DELTA" ]; then
              echo "[proliferate] summary_health_delta=${SUMMARY_DELTA}"
              SUMMARY_REGRESSION=$(python3 -c "import sys; print('1' if float(sys.argv[1]) < -0.001 else '0')" "$SUMMARY_DELTA")
              if [ "$SUMMARY_REGRESSION" = "1" ]; then
                echo "::warning::Proliferate summary.json health_delta is negative: ${SUMMARY_DELTA}"
              fi
            else
              echo "summary.json health_delta missing or null"
            fi
          else
            echo "summary.json missing or empty; skipping summary health_delta check"
          fi
          if [ ! -s /tmp/proliferate/pre_health.json ] || [ ! -s /tmp/proliferate/post_health.json ]; then
            echo "skipping health-delta comparison: pre or post snapshot missing"
            if [ "$SUMMARY_REGRESSION" = "1" ]; then
              echo "health_regression=true" >> "$GITHUB_OUTPUT"
            else
              echo "health_regression=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # SECURITY: pass JSON-derived values via sys.argv rather than
          # interpolating them into the python -c source string. The
          # health snapshot is currently produced by `python -m agent
          # health` and always emits a numeric score, but treating the
          # value as untrusted keeps this step robust if the JSON shape
          # ever drifts (e.g. score=null or a string sentinel).
          # See the security note at the top of the "Run proliferate"
          # step (search "shell injection").
          PRE_SCORE=$(python3 -c "import json; d=json.load(open('/tmp/proliferate/pre_health.json')); print(d.get('score', d.get('health_score', 0.0)))")
          POST_SCORE=$(python3 -c "import json; d=json.load(open('/tmp/proliferate/post_health.json')); print(d.get('score', d.get('health_score', 0.0)))")
          DELTA=$(python3 -c "import sys; print(float(sys.argv[1]) - float(sys.argv[2]))" "$POST_SCORE" "$PRE_SCORE")
          echo "[proliferate] pre=${PRE_SCORE} post=${POST_SCORE} delta=${DELTA}"
          SNAPSHOT_REGRESSION=$(python3 -c "import sys; print('1' if (float(sys.argv[1]) - float(sys.argv[2])) < -0.001 else '0')" "$POST_SCORE" "$PRE_SCORE")
          IS_REGRESSION="$SNAPSHOT_REGRESSION"
          if [ "$SUMMARY_REGRESSION" = "1" ]; then
            IS_REGRESSION="1"
          fi
          if [ "$IS_REGRESSION" = "1" ]; then
            if [ "$SNAPSHOT_REGRESSION" = "1" ]; then
              echo "::warning::Proliferate health score regressed: pre=${PRE_SCORE} post=${POST_SCORE} delta=${DELTA}"
            fi
            # Task 2-A: expose the regression flag as a step output so
            # downstream steps can conditionally skip artifact uploads
            # or surface a failure annotation without re-parsing JSON.
            echo "health_regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "health_regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Annotate health regression (Task 2-A)
        if: always() && steps.health_compare.outputs.health_regression == 'true'
        run: |
          echo "::error::Proliferate run regressed proof-health; downstream artifact uploads will still occur for forensics, but operators should treat this as a hard signal."

      - name: Run LLM benchmark (scheduled + opt-in)
        if: always() && (github.event_name == 'schedule' || github.event.inputs.run_benchmark == 'true')
        working-directory: mumei-agent
        env:
          LLM_BENCHMARK_MODELS: ${{ steps.llm_env.outputs.model }}
          LLM_BENCHMARK_TRIALS: '3'
          LLM_BENCHMARK_OUTPUT: /tmp/proliferate/benchmark.json
          LLM_API_KEY: ${{ steps.llm_env.outputs.api_key }}
          LLM_BASE_URL: ${{ steps.llm_env.outputs.base_url }}
          MUMEI_BIN: mumei
          # Same rationale as the "Run proliferate" step: the benchmark
          # invokes `mumei verify` on generated source files written to
          # /tmp, which import `std/core` etc. Without MUMEI_STD_PATH the
          # compiler cannot resolve those imports, producing artificially
          # low success_rate values unrelated to model quality.
          MUMEI_STD_PATH: ${{ github.workspace }}/mumei/std
        run: |
          pytest -m benchmark tests/test_llm_benchmark.py --tb=short || true

      - name: Update benchmark history
        if: always()
        working-directory: mumei-agent
        run: |
          if [ -s /tmp/proliferate/benchmark.json ]; then
            python scripts/update_benchmark_history.py \
              --benchmark /tmp/proliferate/benchmark.json \
              --history docs/BENCHMARK_HISTORY.md
          else
            echo "benchmark.json missing or empty; skipping history update"
          fi

      - name: Commit benchmark history
        if: always() && github.event_name == 'schedule'
        working-directory: mumei-agent
        run: |
          if [ ! -s /tmp/proliferate/benchmark.json ]; then
            echo "benchmark.json missing or empty; skipping history commit"
            exit 0
          fi
          if git diff --quiet docs/BENCHMARK_HISTORY.md; then
            echo "benchmark history unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BENCHMARK_HISTORY.md
          git commit -m "docs: update benchmark history"
          git pull --rebase origin develop
          git push origin HEAD:develop

      - name: Upload benchmark history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: mumei-agent/docs/BENCHMARK_HISTORY.md

      - name: Upload proliferate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proliferate-logs
          path: |
            /tmp/proliferate/pre_health.json
            /tmp/proliferate/post_health.json
            /tmp/proliferate/proliferate.log
            /tmp/proliferate/summary.json
            /tmp/proliferate/benchmark.json

      - name: Fail on health regression
        if: always() && steps.health_compare.outputs.health_regression == 'true'
        run: |
          echo "::error::Health score regressed. Aborting to prevent degraded PRs from being merged."
          exit 1
