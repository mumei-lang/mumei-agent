name: Contract Vocabulary

on:
  pull_request:
    branches: [develop]
    paths:
      - 'README.md'
      - 'docs/VERIFICATION_WORKFLOW_GUIDE.md'
      - 'docs/ROADMAP.md'
      - 'docs/MCP_SERVER.md'
      - 'agent/mcp_server.py'
      - 'tests/test_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - '.github/workflows/contract-vocabulary.yml'
  push:
    branches: [develop]
    paths:
      - 'README.md'
      - 'docs/VERIFICATION_WORKFLOW_GUIDE.md'
      - 'docs/ROADMAP.md'
      - 'docs/MCP_SERVER.md'
      - 'agent/mcp_server.py'
      - 'tests/test_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - '.github/workflows/contract-vocabulary.yml'
  workflow_dispatch:

jobs:
  contract-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install agent package with test dependencies
        run: python -m pip install -e ".[test]"

      - name: Check docs contract vocabulary
        run: python -m pytest tests/test_contract_vocabulary.py tests/test_ci_workflow_timeouts.py -q
