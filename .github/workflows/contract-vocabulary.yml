name: Contract Vocabulary

on:
  pull_request:
    branches: [develop]
    paths:
      - 'README.md'
      - 'docs/VERIFICATION_WORKFLOW_GUIDE.md'
      - 'docs/ROADMAP.md'
      - 'tests/test_contract_vocabulary.py'
      - '.github/workflows/contract-vocabulary.yml'
  workflow_dispatch:

jobs:
  contract-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Check docs contract vocabulary
        run: python -m pytest tests/test_contract_vocabulary.py -q
