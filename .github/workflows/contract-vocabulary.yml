# Cross-repo note (mumei-lang/mumei#1500): the composite action owns only
# the common Python/dependency runner. mumei-agent's path filter and pytest
# selection are repo-specific because this repository owns the agent MCP tool
# surface, foreign-code extraction helpers, and bridge-lemma consumer contract.
name: Contract Vocabulary

on:
  pull_request:
    branches: [develop]
    paths:
      - 'README.md'
      - 'docs/VERIFICATION_WORKFLOW_GUIDE.md'
      - 'docs/ROADMAP.md'
      - 'docs/MCP_SERVER.md'
      - 'agent/mcp_server.py'
      - 'tests/test_contract_vocabulary.py'
      - 'schema/bridge_lemma_catalog.json'
      - 'agent/strategies/foreign_code_strategy_helpers.py'
      - 'tests/test_mcp_tool_contract.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - '.github/workflows/contract-vocabulary.yml'
  push:
    branches: [develop]
    paths:
      - 'README.md'
      - 'docs/VERIFICATION_WORKFLOW_GUIDE.md'
      - 'docs/ROADMAP.md'
      - 'docs/MCP_SERVER.md'
      - 'agent/mcp_server.py'
      - 'tests/test_contract_vocabulary.py'
      - 'schema/bridge_lemma_catalog.json'
      - 'agent/strategies/foreign_code_strategy_helpers.py'
      - 'tests/test_mcp_tool_contract.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - '.github/workflows/contract-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run contract vocabulary checks
        uses: mumei-lang/mumei/.github/actions/contract-vocabulary@develop
        with:
          python_version: '3.11'
          install_command: python -m pip install -e ".[test]"
          check_command: python -m pytest tests/test_contract_vocabulary.py tests/test_ci_workflow_timeouts.py tests/test_mcp_tool_contract.py -q
