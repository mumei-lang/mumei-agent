name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra test --frozen

      # Regression gate for A1 stage 3 / L3: the Solidity guard-trace obligation
      # class must keep extracting guard-trace atoms and upgrading them through
      # the mumei-lean Lean bridge to `lean_verified`. Run these fail-fast
      # before the full suite so a guard-trace regression is unmistakable.
      - name: Guard-trace regression gate (A1 stage 3 / L3)
        run: uv run pytest tests/test_foreign_code.py tests/test_audit.py -k "guard_trace" -v --tb=short -m "not integration"

      # Regression gate for the Solidity access-control obligation class: every
      # externally callable state-mutating function must keep producing an
      # access-control atom (guarded -> Checked, unguarded -> none) that upgrades
      # through the mumei-lean Lean bridge to `lean_verified`.
      - name: Access-control regression gate (smart-contract patterns)
        run: uv run pytest tests/test_foreign_code.py tests/test_audit.py -k "access_control" -v --tb=short -m "not integration"

      # Regression gate for the Solidity Checks-Effects-Interactions (CEI)
      # ordering obligation class: every function that both mutates state and
      # performs an external interaction lowers to a concrete runCei trace
      # (effect-before-interaction -> some CeiState.Interacted, reordered ->
      # none) that upgrades through the mumei-lean Lean bridge to `lean_verified`.
      - name: CEI ordering regression gate (smart-contract patterns)
        run: uv run pytest tests/test_foreign_code.py tests/test_audit.py -k "cei" -v --tb=short -m "not integration"

      # NOTE: Integration tests (marked @pytest.mark.integration) are excluded
      # from CI. Run them locally with: uv run pytest -m integration
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short -m "not integration" --cov=agent --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
