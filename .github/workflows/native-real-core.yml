name: Native real-Core integration

# The main CI job excludes integration tests; this workflow runs the bounded
# real-Core contract subset against Core develop to detect contract drift. It
# is a consumption check and makes no ABI, runtime, or object-TV claim.

on:
  schedule:
    # Friday 02:00 UTC, offset from Monday proliferate and Wednesday dogfood-triage.
    - cron: '0 2 * * 5'
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - agent/native_*.py
      - agent/body_port.py
      - agent/core_evidence*.py
      - agent/evidence_accept*.py
      - agent/context_files.py
      - agent/evidence_check_*.py
      - agent/harness_metrics.py
      - agent/lean_bridge.py
      - agent/metrics.py
      - agent/observe_tests.py
      - agent/proliferate*.py
      - agent/strategies/**
      - agent/test_harvest.py
      - agent/verify_accept*.py
      - agent/verify_distribution.py
      - agent/verify_attempt*.py
      - agent/verify_recheck*.py
      - agent/verify_schedule.py
      - agent/mumei_client.py
      - tests/test_evidence_check_*.py
      - tests/test_core_evidence.py
      - tests/test_evidence_accept_list.py
      - tests/test_native_*.py
      - tests/test_forge_e2e.py
      - tests/test_erosion_binary_integration.py
      - tests/test_body_port.py
      - tests/test_binary_integration.py
      - tests/test_audit.py
      - tests/test_observe_tests_cli.py
      - tests/test_proliferate_sibling_lemmas.py
      - tests/test_verify_accept.py
      - tests/test_verify_distribution.py
      - tests/test_verify_attempt.py
      - tests/test_verify_recheck.py
      - tests/test_verify_schedule.py
      - tests/test_controls_gate.py
      - .github/workflows/native-real-core.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  real-core-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Check out mumei-agent
        uses: actions/checkout@v4
        with:
          path: mumei-agent

      - name: Check out mumei
        # mumei-lang/mumei is public, so a plain anonymous clone is
        # sufficient. The workflow token is scoped to mumei-agent.
        run: |
          git clone --depth 1 --single-branch --branch develop \
            https://github.com/mumei-lang/mumei.git mumei

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install mumei system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libclang-dev libz3-dev z3 libzstd-dev
          CODENAME="$(lsb_release -cs)"
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] \
            http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-17 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-17.list
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev libpolly-17-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mumei/target
          key: cargo-mumei-native-${{ hashFiles('mumei/Cargo.lock') }}
          restore-keys: |
            cargo-mumei-native-

      - name: Build mumei compiler
        working-directory: mumei
        env:
          LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Install agent dependencies
        working-directory: mumei-agent
        run: uv sync --extra test --frozen

      - name: Record Core commit
        run: |
          CORE_SHA="$(git -C mumei rev-parse HEAD)"
          echo "Core develop commit: \`${CORE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run real-Core native integration tests
        working-directory: mumei-agent
        run: |
          MUMEI_BIN="$GITHUB_WORKSPACE/mumei/target/release/mumei" \
            uv run pytest \
              tests/test_native_accept.py \
              tests/test_native_evidence_accept.py \
              tests/test_native_evidence_recheck.py \
              tests/test_native_exit_status_accept.py \
              tests/test_native_machine_tv_recheck.py \
              tests/test_native_object_accept.py \
              tests/test_native_object_acceptance_recheck.py \
              tests/test_native_object_recheck.py \
              tests/test_native_observations_accept.py \
              tests/test_native_observations_recheck.py \
              tests/test_native_recheck.py \
              tests/test_native_stderr_accept.py \
              tests/test_native_stderr_recheck.py \
              tests/test_native_stdout_accept.py \
              tests/test_native_stdout_recheck.py \
              tests/test_verify_recheck.py \
              tests/test_verify_distribution.py \
              tests/test_controls_gate.py \
              tests/test_core_evidence.py \
              tests/test_evidence_accept_list.py \
              tests/test_evidence_check_adapter.py \
              tests/test_evidence_check_attempt_acceptance.py \
              tests/test_evidence_check_schedule.py \
              tests/test_verify_accept.py \
              tests/test_verify_attempt.py \
              tests/test_binary_integration.py \
              tests/test_audit.py \
              tests/test_forge_e2e.py \
              -m integration --run-integration \
              -v --tb=short --junitxml=real-core-junit.xml

      - name: Run real-Core binary-gated unit tests
        working-directory: mumei-agent
        run: |
          MUMEI_BIN="$GITHUB_WORKSPACE/mumei/target/release/mumei" \
          MUMEI_EROSION_BIN="$GITHUB_WORKSPACE/mumei/target/release/mumei" \
            uv run pytest \
              tests/test_evidence_check_consistency.py::TestRealCore::test_real_check_consistency_reports_consistent \
              tests/test_evidence_check_consistency.py::TestRealCore::test_real_check_consistency_rejected_envelope_claims_nothing \
              tests/test_evidence_check_list.py::TestRealCore::test_real_check_list_reports_valid \
              tests/test_evidence_check_list.py::TestRealCore::test_real_check_list_rejects_bogus_bytes \
              tests/test_evidence_check_route.py::TestRealCore::test_real_check_reports_valid \
              tests/test_evidence_check_route.py::TestRealCore::test_real_check_rejects_bogus_bytes \
              tests/test_native_attempt.py::TestRealCore::test_real_build_selects_and_pins_build_id \
              tests/test_native_attempt.py::TestRealCore::test_outside_profile_source_selects_nothing \
              tests/test_native_check.py::test_real_core_end_to_end \
              tests/test_native_artifact_recheck.py::test_real_core_end_to_end \
              tests/test_native_source_recheck.py::test_real_core_end_to_end \
              tests/test_native_exit_status_recheck.py::test_real_core_end_to_end \
              tests/test_observe_tests_cli.py::test_observe_tests_real_mumei_integration \
              tests/test_proliferate_sibling_lemmas.py::test_real_mumei_resolves_sibling_from_verify_dir \
              tests/test_proliferate_sibling_lemmas.py::test_real_mumei_claims_exposes_g4_grade \
              tests/test_verify_schedule.py::test_exported_triple_passes_the_real_claim_gate \
              tests/test_body_port.py::test_porter_verifies_with_mumei \
              tests/test_erosion_binary_integration.py::test_real_mumei_erosion_binary_detects_weakened_contract_and_body_only_change \
              -m "not integration" \
              -v --tb=short --junitxml=real-core-unmarked-junit.xml

      - name: Reject skipped or missing real-Core tests
        working-directory: mumei-agent
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = [
              ("Real-Core native integration", "real-core-junit.xml", 100),
              ("Real-Core binary-gated unit tests", "real-core-unmarked-junit.xml", 21),
          ]
          lines = [
              "### Real-Core test results",
              "",
              "| Suite | Total | Skipped | Failures | Errors |",
              "|---|---:|---:|---:|---:|",
              "",
          ]
          invalid = []
          for name, path, floor in reports:
              report = ET.parse(path).getroot()
              testcases = report.findall(".//testcase")
              total = len(testcases)
              skipped = sum(case.find("skipped") is not None for case in testcases)
              failures = sum(case.find("failure") is not None for case in testcases)
              errors = sum(case.find("error") is not None for case in testcases)
              lines.append(
                  f"| {name} | {total} | {skipped} | {failures} | {errors} |"
              )
              if total < floor or skipped > 0 or failures + errors > 0:
                  invalid.append(
                      f"{name} must include at least {floor} tests with no skips, failures, or errors."
                  )
          summary = "\n".join(lines)
          print(summary, end="")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write(summary)
          if invalid:
              for message in invalid:
                  print(message, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload real-Core JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-core-junit
          path: |
            mumei-agent/real-core-junit.xml
            mumei-agent/real-core-unmarked-junit.xml
