name: Mumei audit
description: >-
  Install mumei and mumei-agent dependencies, audit existing source code,
  upload SARIF, and write a GitHub Actions step summary.
author: mumei-lang
branding:
  icon: shield
  color: blue
inputs:
  code-file:
    description: Source file or directory to audit, relative to the caller workspace unless absolute.
    required: true
  language:
    description: Optional source language passed to mumei-agent audit.
    required: false
    default: ""
  mumei-version:
    description: Mumei version to install, or latest.
    required: false
    default: latest
  python-version:
    description: Python version used for mumei-agent.
    required: false
    default: "3.11"
  audit-args:
    description: Additional space-separated arguments for mumei-agent audit.
    required: false
    default: ""
  audit-output:
    description: Audit JSON path, relative to the caller workspace.
    required: false
    default: .mumei-audit/audit.json
  sarif-output:
    description: SARIF output path, relative to the caller workspace.
    required: false
    default: .mumei-audit/audit.sarif
  artifact-name:
    description: Name for the audit evidence artifact.
    required: false
    default: mumei-audit-evidence
  upload-sarif:
    description: Upload SARIF to GitHub code scanning when the file is produced.
    required: false
    default: true
    type: boolean
outputs:
  audit_exit_code:
    description: mumei-agent audit process exit classification.
    value: ${{ steps.audit.outputs.audit_exit_code }}
  setup_seconds:
    description: Seconds spent installing the pinned toolchain and dependencies.
    value: ${{ steps.timing.outputs.setup_seconds }}
  audit_seconds:
    description: Seconds spent in mumei-agent audit.
    value: ${{ steps.timing.outputs.audit_seconds }}
  total_seconds:
    description: Seconds from setup start through audit completion.
    value: ${{ steps.timing.outputs.total_seconds }}
runs:
  using: composite
  steps:
    - name: Start timing
      shell: bash
      run: |
        ACTION_STATE="$(mktemp -d "$RUNNER_TEMP/mumei-audit.XXXXXX")"
        mkdir -p "$ACTION_STATE/timing"
        date +%s > "$ACTION_STATE/timing/start"
        echo "ACTION_STATE=$ACTION_STATE" >> "$GITHUB_ENV"

    - name: Locate bundled mumei-agent source
      shell: bash
      run: |
        AGENT_ROOT="$(cd "${{ github.action_path }}/../../.." && pwd)"
        test -f "$AGENT_ROOT/pyproject.toml"
        test -f "$AGENT_ROOT/uv.lock"
        echo "AGENT_ROOT=$AGENT_ROOT" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs['python-version'] }}

    - name: Set up uv with dependency cache
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: ${{ env.AGENT_ROOT }}/uv.lock

    - name: Install mumei
      shell: bash
      env:
        VERSION: ${{ inputs['mumei-version'] }}
      run: |
        if [ "$VERSION" = "latest" ]; then
          curl -fsSL https://mumei-lang.github.io/mumei/install.sh | bash
        else
          curl -fsSL https://mumei-lang.github.io/mumei/install.sh | bash -s -- --version "$VERSION"
        fi
        echo "$HOME/.mumei/bin" >> "$GITHUB_PATH"
        echo "MUMEI_STD_PATH=$HOME/.mumei/std" >> "$GITHUB_ENV"

    - name: Install mumei-agent dependencies
      shell: bash
      run: |
        cd "$AGENT_ROOT"
        uv sync --frozen
        uv run python -c 'import agent; print("mumei-agent dependencies ready")'

    - name: Finish setup timing
      shell: bash
      run: date +%s > "$ACTION_STATE/timing/setup_end"

    - name: Run mumei-agent audit
      id: audit
      shell: bash
      env:
        CODE_FILE: ${{ inputs['code-file'] }}
        LANGUAGE: ${{ inputs.language }}
        AUDIT_ARGS: ${{ inputs['audit-args'] }}
        AUDIT_OUTPUT: ${{ inputs['audit-output'] }}
        SARIF_OUTPUT: ${{ inputs['sarif-output'] }}
      run: |
        case "$CODE_FILE" in
          /*) TARGET="$CODE_FILE" ;;
          *) TARGET="$GITHUB_WORKSPACE/$CODE_FILE" ;;
        esac
        case "$AUDIT_OUTPUT" in
          /*) AUDIT_JSON="$AUDIT_OUTPUT" ;;
          *) AUDIT_JSON="$GITHUB_WORKSPACE/$AUDIT_OUTPUT" ;;
        esac
        case "$SARIF_OUTPUT" in
          /*) SARIF_FILE="$SARIF_OUTPUT" ;;
          *) SARIF_FILE="$GITHUB_WORKSPACE/$SARIF_OUTPUT" ;;
        esac
        prepare_output_path() {
          python "${{ github.action_path }}/scripts/prepare_output_path.py" "$1"
        }
        prepare_output_path "$AUDIT_JSON"
        prepare_output_path "$SARIF_FILE"
        ARGS=(audit --code-file "$TARGET" --format json --output "$AUDIT_JSON" --sarif-output "$SARIF_FILE")
        if [ -n "$LANGUAGE" ]; then
          ARGS+=(--language "$LANGUAGE")
        fi
        expand_argument_path() {
          case "$1" in
            /*) printf '%s\n' "$1" ;;
            ~) printf '%s\n' "$HOME" ;;
            ~/*) printf '%s/%s\n' "$HOME" "${1#~/}" ;;
            *) printf '%s/%s\n' "$GITHUB_WORKSPACE" "$1" ;;
          esac
        }
        WRITE_BASELINE_PATH=""
        BASELINE_PATH=""
        if [ -n "$AUDIT_ARGS" ]; then
          read -r -a EXTRA_ARGS <<< "$AUDIT_ARGS"
          ARGS+=("${EXTRA_ARGS[@]}")
          for ((i = 0; i < ${#EXTRA_ARGS[@]}; i++)); do
            token="${EXTRA_ARGS[i]}"
            value=""
            kind=""
            if [ "$token" = "--write-baseline" ] && [ $((i + 1)) -lt ${#EXTRA_ARGS[@]} ]; then
              value="${EXTRA_ARGS[i + 1]}"
              kind=write
            elif [[ "$token" == --write-baseline=* ]]; then
              value="${token#--write-baseline=}"
              kind=write
            elif [ "$token" = "--baseline" ] && [ $((i + 1)) -lt ${#EXTRA_ARGS[@]} ]; then
              value="${EXTRA_ARGS[i + 1]}"
              kind=read
            elif [[ "$token" == --baseline=* ]]; then
              value="${token#--baseline=}"
              kind=read
            fi
            if [ -n "$value" ]; then
              expanded="$(expand_argument_path "$value")"
              if [ "$kind" = write ]; then
                WRITE_BASELINE_PATH="$expanded"
              else
                BASELINE_PATH="$expanded"
              fi
            fi
          done
          if [ -n "$WRITE_BASELINE_PATH" ]; then
            if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" = "$WRITE_BASELINE_PATH" ] && [ -L "$WRITE_BASELINE_PATH" ]; then
              echo "::error::--baseline and --write-baseline cannot share a symlink path; use a regular baseline file or separate output."
              exit 2
            fi
            if [ -e "$WRITE_BASELINE_PATH" ] || [ -L "$WRITE_BASELINE_PATH" ]; then
              WRITE_BASELINE_BEFORE="$(stat -c %y "$WRITE_BASELINE_PATH" 2>/dev/null || echo unreadable)"
            else
              WRITE_BASELINE_BEFORE=absent
            fi
            prepare_output_path "$WRITE_BASELINE_PATH"
          fi
        fi
        date +%s > "$ACTION_STATE/timing/audit_start"
        set +e
        UV_PROJECT="$AGENT_ROOT" uv run python -I -m agent "${ARGS[@]}" \
          > "$ACTION_STATE/audit.stdout.log" 2> "$ACTION_STATE/audit.stderr.log"
        EXIT_CODE=$?
        set -e
        date +%s > "$ACTION_STATE/timing/audit_end"
        if [ -f "$AUDIT_JSON" ] && [ ! -L "$AUDIT_JSON" ]; then
          cp "$AUDIT_JSON" "$ACTION_STATE/audit.json"
        fi
        if [ -f "$SARIF_FILE" ] && [ ! -L "$SARIF_FILE" ]; then
          cp "$SARIF_FILE" "$ACTION_STATE/audit.sarif"
        fi
        if [ -n "$WRITE_BASELINE_PATH" ] && [ -f "$WRITE_BASELINE_PATH" ] && [ ! -L "$WRITE_BASELINE_PATH" ]; then
          WRITE_BASELINE_AFTER="$(stat -c %y "$WRITE_BASELINE_PATH" 2>/dev/null || echo unreadable)"
          if [ "$WRITE_BASELINE_BEFORE" = absent ] || [ "$WRITE_BASELINE_AFTER" != "$WRITE_BASELINE_BEFORE" ]; then
            cp "$WRITE_BASELINE_PATH" "$ACTION_STATE/generated-baseline.json"
          fi
        fi
        echo "audit_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

    - name: Check SARIF artifact
      id: sarif
      if: always()
      shell: bash
      env:
        SARIF_OUTPUT: ${{ inputs['sarif-output'] }}
        UPLOAD_SARIF: ${{ inputs['upload-sarif'] }}
      run: |
        case "$SARIF_OUTPUT" in
          /*) SARIF_FILE="$SARIF_OUTPUT" ;;
          *) SARIF_FILE="$GITHUB_WORKSPACE/$SARIF_OUTPUT" ;;
        esac
        case "${UPLOAD_SARIF,,}" in
          true|1|yes) WANT_UPLOAD=true ;;
          *) WANT_UPLOAD=false ;;
        esac
        if [ "$WANT_UPLOAD" = true ] && [ -s "$SARIF_FILE" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Write step summary and timing outputs
      id: timing
      if: always()
      shell: bash
      env:
        AUDIT_OUTPUT: ${{ inputs['audit-output'] }}
        AUDIT_EXIT_CODE: ${{ steps.audit.outputs.audit_exit_code }}
      run: |
        case "$AUDIT_OUTPUT" in
          /*) AUDIT_JSON="$AUDIT_OUTPUT" ;;
          *) AUDIT_JSON="$GITHUB_WORKSPACE/$AUDIT_OUTPUT" ;;
        esac
        if [ -z "$AUDIT_EXIT_CODE" ]; then
          AUDIT_EXIT_CODE=2
        fi
        python "${{ github.action_path }}/scripts/summarize_audit.py" \
          --audit-json "$AUDIT_JSON" \
          --exit-code "$AUDIT_EXIT_CODE" \
          --timing-dir "$ACTION_STATE/timing" \
          --github-output "$GITHUB_OUTPUT"

    - name: Upload audit evidence artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs['artifact-name'] }}
        path: ${{ env.ACTION_STATE }}
        if-no-files-found: warn
        include-hidden-files: true

    - name: Upload SARIF to code scanning
      if: always() && steps.sarif.outputs.present == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs['sarif-output'] }}

    - name: Enforce audit result
      if: always() && steps.audit.outputs.audit_exit_code != '0'
      shell: bash
      run: |
        echo "::error::mumei-agent audit exited with classification ${{ steps.audit.outputs.audit_exit_code }}; inspect the step summary and SARIF artifact."
        exit 1
