# OpenTelemetry Collector (contrib) config for the mumei-agent reference
# observability stack. Local-verification use only — see docs/OBSERVABILITY.md.
#
# Pipeline:
#   receivers: OTLP gRPC (:4317) + HTTP (:4318) from mumei-agent (Python) and
#              the `mumei` binary built with `--features otel` (Rust).
#   traces  -> Jaeger (OTLP gRPC on jaeger:4317)
#   metrics -> Prometheus exporter (:8889), scraped by the prometheus service.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  # Traces -> Jaeger all-in-one's OTLP receiver.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics -> Prometheus scrape endpoint. add_metric_suffixes keeps the
  # `_total` / `_seconds` suffixes referenced by the Grafana dashboards.
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: true
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
