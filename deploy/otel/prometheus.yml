# Prometheus scrape config for the mumei-agent reference observability stack.
# Local-verification use only — see docs/OBSERVABILITY.md.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# SLO alert rules (P15 operational alerts / SLO layer). See
# deploy/otel/alert_rules.yml and the "Alerts / SLO" section of
# docs/OBSERVABILITY.md.
rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Metrics exported by the OTel Collector's prometheus exporter (:8889).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own internal telemetry (optional, useful for debugging).
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
