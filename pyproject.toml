[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mumei-agent"
version = "0.1.0"
description = "AI-driven autonomous fix loop for the Mumei programming language"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
# P10 — MCP integration is opt-in.  Install with
# ``pip install mumei-agent[mcp]`` to enable the ``mcp-server``
# subcommand and the ``USE_MCP_CLIENT=true`` verification path.  The
# agent's heal / generate / forge / proliferate / publish flows do
# not require this package.
mcp = [
    "mcp[cli]>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # MCP suite (tests/test_mcp_*) imports the SDK at module import
    # time, so the test extra pulls it in transitively.
    "mcp[cli]>=1.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "benchmarks*"]

[project.scripts]
mumei-heal = "agent.self_healing:main"
mumei-extract-spec = "agent.extract_spec:main"
mumei-agent-mcp = "agent.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring mumei binary (deselect with '-m \"not integration\"')",
    "benchmark: marks LLM model-quality benchmarks (opt-in with '-m benchmark'; skipped by default because they call real LLM APIs)",
]
