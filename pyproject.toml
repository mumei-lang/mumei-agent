[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mumei-agent"
version = "0.1.0"
description = "AI-driven autonomous fix loop for the Mumei programming language"
requires-python = ">=3.11"
dependencies = [
    "chardet>=5.0",
    "cryptography>=42.0",
    "numpy>=1.26",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "z3-solver>=4.12",
    # Layer B stage 1 — deterministic syntactic function/block extraction.
    # tree-sitter is a pure in-process parser (no solc/rustc/tsc, no network),
    # so it preserves the LLM-credential-free deterministic fixture path.
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-rust>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-solidity>=1.2",
]

[project.optional-dependencies]
# P10 — MCP integration is opt-in.  Install with
# ``pip install mumei-agent[mcp]`` to enable the ``mcp-server``
# subcommand and the ``USE_MCP_CLIENT=true`` verification path.  The
# agent's heal / generate / forge / proliferate / publish flows do
# not require this package.
mcp = [
    "mcp[cli]>=1.0",
]
# P15 — OpenTelemetry observability is opt-in.  Install with
# ``pip install mumei-agent[otel]`` (or ``uv sync --extra otel``) and set
# ``OTEL_ENABLED=true`` plus ``OTEL_EXPORTER_OTLP_ENDPOINT`` to export
# LLM/tool spans and token metrics to an OTLP backend.  The agent's
# heal / generate / forge / proliferate flows fall back to NoOp
# tracers/meters and run unchanged when this extra is not installed.
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "opentelemetry-instrumentation-openai>=0.1",  # if available
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # MCP suite (tests/test_mcp_*) imports the SDK at module import
    # time, so the test extra pulls it in transitively.
    "mcp[cli]>=1.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "benchmarks*"]

[project.scripts]
mumei-heal = "agent.self_healing:main"
mumei-extract-spec = "agent.extract_spec:main"
mumei-agent-mcp = "agent.mcp_server:main"
mumei-agent = "agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring mumei binary (deselect with '-m \"not integration\"')",
    "benchmark: marks LLM model-quality benchmarks (opt-in with '-m benchmark'; skipped by default because they call real LLM APIs)",
]
