[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mumei-agent"
version = "0.1.0"
description = "AI-driven autonomous fix loop for the Mumei programming language"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[project.scripts]
mumei-heal = "agent.self_healing:main"
mumei-agent-mcp = "agent.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring mumei binary (deselect with '-m \"not integration\"')",
    "benchmark: marks LLM model-quality benchmarks (opt-in with '-m benchmark'; skipped by default because they call real LLM APIs)",
]
