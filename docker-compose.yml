# Ollama containerization for Mumei Agent
#
# Usage:
#   1. docker compose up -d
#   2. docker exec mumei-ollama ollama pull qwen3.5:4b
#      (the benchmark-selected default; see .env.example / dogfood workflows)
#   3. Configure .env (Pattern 1 is pre-configured)
#   4. Run: uv run python -m agent.self_healing

services:
  ollama:
    # Pinned tag: `latest` is mutable and would make the local LLM env
    # non-reproducible.
    image: ollama/ollama:0.34.2
    container_name: mumei-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Default Ollama context is often 2048; 32768 trades more KV cache
      # memory for longer prompts. Tune down if GPU/CPU memory is limited.
      OLLAMA_NUM_CTX: "32768"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment below for GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Future: agent container
  # agent:
  #   build: .
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   environment:
  #     - LLM_BASE_URL=http://ollama:11434/v1
  #     - MUMEI_BIN=mumei

volumes:
  ollama_models:
