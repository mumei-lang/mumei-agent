# Reference OTLP observability backend for mumei-agent (P15).
#
# OPT-IN / LOCAL VERIFICATION ONLY. This stack is NOT required for normal
# agent operation — mumei-agent runs identically without it. Use it to
# visualize the distributed traces and metrics emitted when the agent is run
# with `OTEL_ENABLED=true` and `OTEL_EXPORTER_OTLP_ENDPOINT` pointed here.
#
# Usage:
#   docker compose -f docker-compose.otel.yml up -d
#   export OTEL_ENABLED=true
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
#   uv run mumei-agent heal examples/effect_test.mm
#
#   Jaeger UI:      http://localhost:16686
#   Grafana:        http://localhost:3000  (anonymous admin, no login)
#   Prometheus:     http://localhost:9090
#
# See docs/OBSERVABILITY.md for the full walkthrough. Ports are chosen to not
# collide with the Ollama service in docker-compose.yml (11434).

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: mumei-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scrape target)
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: mumei-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mumei-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deploy/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mumei-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./deploy/otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/otel/dashboards:/var/lib/grafana/dashboards:ro
      - mumei_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  mumei_grafana_data:
